name: Scheduled jobs

# Replaced by cron-job.org (2026-09-09) — GitHub Actions' free scheduled-
# workflow queue turned out to drift far more than "a few minutes" (observed
# gaps of 40min-2hr+ under load), so the actual */5, */10, */30 triggers now
# live on cron-job.org, which honors them to the minute. This workflow is
# kept manual-only (workflow_dispatch) as a fallback that can still be run
# by hand if cron-job.org is ever down — the `schedule:` triggers below are
# intentionally removed, not just disabled per-job.

on:
  workflow_dispatch: {}

jobs:
  reminders-followup:
    if: github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf --max-time 60 -X POST -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" https://final-crm-kappa.vercel.app/api/cron/reminders-followup

  reminders-operations:
    if: github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf --max-time 60 -X POST -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" https://final-crm-kappa.vercel.app/api/cron/reminders-operations

  reminders-finance:
    if: github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf --max-time 60 -X POST -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" https://final-crm-kappa.vercel.app/api/cron/reminders-finance

  meta-sync:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf --max-time 60 -X POST -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" https://final-crm-kappa.vercel.app/api/cron/meta-sync

  automation-sweep:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf --max-time 60 -X POST -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" https://final-crm-kappa.vercel.app/api/cron/automation-sweep

  lead-backfill:
    if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf --max-time 60 -X POST -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" https://final-crm-kappa.vercel.app/api/cron/lead-backfill
